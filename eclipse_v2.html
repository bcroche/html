<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador Eclipse Total 2026</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .card {
            background-color: #151d30;
            padding: 1.5rem;
            border-radius: 1.25rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 1px solid #1e293b;
        }

        h1 { margin: 0 0 1rem 0; font-size: 1.5rem; color: #ffffff; }

        .panel {
            background: #0f172a;
            padding: 1rem;
            border-radius: 0.8rem;
            border: 1px solid #1e293b;
            margin-bottom: 1rem;
            text-align: left;
        }

        .panel-title {
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            margin-bottom: 0.8rem;
        }

        label { font-size: 0.85rem; color: #cbd5e1; }

        input, select {
            width: 100%;
            padding: 0.6rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #f8fafc;
            font-size: 0.95rem;
        }

        .row { display: flex; gap: 0.5rem; }

        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 0.6rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); color: white; margin-top: 0.5rem; }
        .btn-test { background: #d97706; color: white; margin-top: 0.5rem; }
        .btn-sec { background: #334155; color: white; padding: 0.5rem; font-size: 0.85rem; }
        .btn-danger-sm { background: #991b1b; color: white; padding: 0.5rem; font-size: 0.85rem; }
        .btn-action { background: #0284c7; color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 0.4rem; cursor: pointer; font-size: 0.8rem; }
        .btn-action:hover { background: #0369a1; }

        .status-box {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 0.8rem;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            display: none;
        }

        .phase-title { font-size: 1rem; font-weight: 600; color: #94a3b8; }

        .timer { 
            font-size: 2.8rem; 
            font-weight: 800; 
            font-family: monospace; 
            color: #fbbf24;
            margin: 0.3rem 0;
        }

        .alert-instruction {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 0.8rem;
            font-weight: 800;
            font-size: 1.15rem;
            display: none;
        }

        .safe { background-color: rgba(22, 101, 52, 0.4); color: #4ade80; border: 2px solid #22c55e; }
        .danger { background-color: rgba(153, 27, 27, 0.4); color: #fca5a5; border: 2px solid #ef4444; }

        .notice-box {
            background-color: #1e293b;
            border-left: 4px solid #38bdf8;
            padding: 0.75rem;
            border-radius: 0.4rem;
            font-size: 0.82rem;
            color: #cbd5e1;
            margin-bottom: 0.8rem;
            line-height: 1.4;
        }

        .notice-box a {
            color: #38bdf8;
            font-weight: bold;
            text-decoration: underline;
        }

        .table-container {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        th, td {
            padding: 0.5rem 0.6rem;
            border-bottom: 1px solid #1e293b;
        }

        th {
            background-color: #1e293b;
            color: #38bdf8;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        tr:hover { background-color: #1e293b; }
    </style>
</head>
<body>

<div class="card">
    <h1>🌑 Temporizador Eclipse 2026</h1>

    <!-- Gestión de Favoritos -->
    <div class="panel">
        <div class="panel-title" style="color: #a855f7;">⭐ Mis Ubicaciones Guardadas</div>
        <div class="input-group">
            <select id="savedLocations" onchange="loadSelectedLocation()">
                <option value="">-- Seleccionar de mis favoritos --</option>
            </select>
        </div>
        <div class="row">
            <button class="btn btn-sec" onclick="saveLocation()">💾 Guardar Actual</button>
            <button class="btn btn-danger-sm" onclick="deleteLocation()">🗑️ Borrar</button>
        </div>
    </div>

    <!-- Panel de Configuración -->
    <div class="panel">
        <div class="input-group">
            <label for="locationName">Nombre del sitio:</label>
            <input type="text" id="locationName" value="Villanueva de la Torre (Guadalajara)">
        </div>

        <div class="row">
            <div class="input-group" style="flex:1;">
                <label for="startTime">Inicio Totalidad:</label>
                <input type="time" id="startTime" step="1" value="20:31:36">
            </div>
            <div class="input-group" style="flex:1;">
                <label for="endTime">Fin Totalidad:</label>
                <input type="time" id="endTime" step="1" value="20:32:34">
            </div>
        </div>

        <div class="input-group">
            <label for="alertSeconds">Aviso previo de sonidos (segundos antes):</label>
            <input type="number" id="alertSeconds" value="20" min="1" max="60">
        </div>
    </div>

    <button class="btn btn-primary" onclick="startApp()">▶️ Iniciar Cuenta Atrás</button>
    <button class="btn btn-test" onclick="runTest()">🧪 MODO TEST (Prueba de 1 minuto)</button>

    <div id="statusBox" class="status-box">
        <div id="locationDisplay" style="color:#38bdf8; font-weight:bold; margin-bottom: 0.3rem;"></div>
        <div id="phaseTitle" class="phase-title">---</div>
        <div id="timer" class="timer">00:00:00</div>
    </div>

    <div id="instruction" class="alert-instruction"></div>

    <hr style="border: 0; border-top: 1px solid #1e293b; margin: 1.5rem 0;">

    <!-- Tabla Catálogo Oficial IGN (Solo Totalidad) -->
    <div class="panel" style="border-color: #0284c7; margin-bottom: 0;">
        <div class="panel-title" style="color: #38bdf8;">🏛️ Lugares con Totalidad Confirmada</div>
        
        <div class="notice-box">
            📌 Las horas varían según tus coordenadas exactas. Consulta la ubicación y hora precisa en el visor interactivo oficial del IGN: <br>
            👉 <a href="https://visualizadores.ign.es/eclipses/2026" target="_blank" rel="noopener">visualizadores.ign.es/eclipses/2026</a>
        </div>

        <div class="input-group">
            <input type="text" id="searchBox" placeholder="🔍 Buscar ciudad..." oninput="filterCatalogTable()">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Ubicación</th>
                        <th>Inicio</th>
                        <th>Fin</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="catalogTableBody">
                    <!-- Rellenado con JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Catálogo únicamente con localizaciones de eclipse TOTAL (Ordenado Alfabéticamente)
    const CATALOGO = [
        { name: "A Coruña", start: "20:27:37", end: "20:28:51" },
        { name: "Ávila", start: "20:30:52", end: "20:31:12" },
        { name: "Bilbao", start: "20:27:17", end: "20:27:49" },
        { name: "Burgos", start: "20:28:19", end: "20:30:04" },
        { name: "Castellón de la Plana", start: "20:31:14", end: "20:32:48" },
        { name: "Cuenca", start: "20:31:48", end: "20:33:00" },
        { name: "Guadalajara", start: "20:31:21", end: "20:32:30" },
        { name: "Huesca", start: "20:28:44", end: "20:30:10" },
        { name: "León", start: "20:28:15", end: "20:29:59" },
        { name: "Logroño", start: "20:28:03", end: "20:29:24" },
        { name: "Lugo", start: "20:28:03", end: "20:29:25" },
        { name: "Madrid (Norte)", start: "20:32:04", end: "20:32:24" },
        { name: "Ourense", start: "20:28:42", end: "20:29:45" },
        { name: "Oviedo", start: "20:27:00", end: "20:28:48" },
        { name: "Palencia", start: "20:29:21", end: "20:31:03" },
        { name: "Palma (Can Pastilla)", start: "20:31:07", end: "20:32:43" },
        { name: "Pamplona", start: "20:27:44", end: "20:28:57" },
        { name: "San Sebastián", start: "20:27:08", end: "20:27:54" },
        { name: "Santander", start: "20:26:51", end: "20:27:55" },
        { name: "Segovia", start: "20:30:46", end: "20:32:03" },
        { name: "Soria", start: "20:29:18", end: "20:30:57" },
        { name: "Teruel", start: "20:31:33", end: "20:32:56" },
        { name: "Tórtola de Henares", start: "20:31:09", end: "20:32:25" },
        { name: "Valencia", start: "20:32:20", end: "20:33:18" },
        { name: "Valladolid", start: "20:29:44", end: "20:31:21" },
        { name: "Villanueva de la Torre (Guadalajara)", start: "20:31:33", end: "20:32:32" },
        { name: "Vitoria-Gasteiz", start: "20:27:37", end: "20:28:42" },
        { name: "Zamora", start: "20:30:50", end: "20:31:04" },
        { name: "Zaragoza", start: "20:29:04", end: "20:30:27" }
    ];

    let audioCtx = null;
    let timerInterval = null;

    document.addEventListener('DOMContentLoaded', () => {
        renderCatalogTable(CATALOGO);
        updateSavedDropdown();
    });

    function renderCatalogTable(data) {
        const tbody = document.getElementById('catalogTableBody');
        tbody.innerHTML = '';

        data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.name}</strong></td>
                <td>${item.start}</td>
                <td>${item.end}</td>
                <td><button class="btn-action" onclick="selectCity('${item.name}', '${item.start}', '${item.end}')">📥 Cargar</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filterCatalogTable() {
        const query = document.getElementById('searchBox').value.toLowerCase();
        const filtered = CATALOGO.filter(item => item.name.toLowerCase().includes(query));
        renderCatalogTable(filtered);
    }

    function selectCity(name, start, end) {
        document.getElementById('locationName').value = name;
        document.getElementById('startTime').value = start;
        document.getElementById('endTime').value = end;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playLoudBeep(freq = 800, duration = 0.2, type = 'square') {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) { console.error(e); }
    }

    function playHeavyAlarm() {
        let count = 0;
        const interval = setInterval(() => {
            playLoudBeep(1200, 0.25, 'sawtooth');
            setTimeout(() => playLoudBeep(600, 0.25, 'square'), 150);
            count++;
            if (count >= 6) clearInterval(interval);
        }, 400);
    }

    function getTimeToday(timeString) {
        const parts = timeString.split(':');
        const hours = parseInt(parts[0], 10);
        const minutes = parseInt(parts[1], 10);
        const seconds = parts[2] ? parseInt(parts[2], 10) : 0;

        const date = new Date();
        date.setHours(hours, minutes, seconds, 0);
        return date.getTime();
    }

    function formatHMS(ms) {
        const totalSec = Math.max(0, Math.floor(ms / 1000));
        const h = Math.floor(totalSec / 3600).toString().padStart(2, '0');
        const m = Math.floor((totalSec % 3600) / 60).toString().padStart(2, '0');
        const s = (totalSec % 60).toString().padStart(2, '0');
        return `${h}:${m}:${s}`;
    }

    function saveLocation() {
        const name = document.getElementById('locationName').value.trim();
        if (!name) { alert('Introduce un nombre para el sitio.'); return; }

        const data = {
            name: name,
            start: document.getElementById('startTime').value,
            end: document.getElementById('endTime').value,
            alertSec: document.getElementById('alertSeconds').value
        };

        let saved = JSON.parse(localStorage.getItem('eclipse_locations') || '{}');
        saved[name] = data;
        localStorage.setItem('eclipse_locations', JSON.stringify(saved));

        updateSavedDropdown();
        document.getElementById('savedLocations').value = name;
        alert('⭐ Guardado en tus ubicaciones.');
    }

    function loadSelectedLocation() {
        const name = document.getElementById('savedLocations').value;
        if (!name) return;

        let saved = JSON.parse(localStorage.getItem('eclipse_locations') || '{}');
        if (saved[name]) {
            document.getElementById('locationName').value = saved[name].name;
            document.getElementById('startTime').value = saved[name].start;
            document.getElementById('endTime').value = saved[name].end;
            if(saved[name].alertSec) document.getElementById('alertSeconds').value = saved[name].alertSec;
        }
    }

    function deleteLocation() {
        const name = document.getElementById('savedLocations').value;
        if (!name) { alert('Selecciona una ubicación favorita para borrar.'); return; }

        let saved = JSON.parse(localStorage.getItem('eclipse_locations') || '{}');
        delete saved[name];
        localStorage.setItem('eclipse_locations', JSON.stringify(saved));

        updateSavedDropdown();
        alert('Ubicación eliminada.');
    }

    function updateSavedDropdown() {
        const dropdown = document.getElementById('savedLocations');
        dropdown.innerHTML = '<option value="">-- Seleccionar de mis favoritos --</option>';

        let saved = JSON.parse(localStorage.getItem('eclipse_locations') || '{}');
        for (let key in saved) {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = key;
            dropdown.appendChild(opt);
        }
    }

    function runTest() {
        const now = new Date();
        const startTest = new Date(now.getTime() + 60 * 1000);
        const endTest = new Date(now.getTime() + 120 * 1000);

        const formatTime = (d) => d.toTimeString().split(' ')[0];

        document.getElementById('locationName').value = "🧪 PRUEBA DE TEST (1 Minuto)";
        document.getElementById('startTime').value = formatTime(startTest);
        document.getElementById('endTime').value = formatTime(endTest);

        startApp();
    }

    function startApp() {
        const startVal = document.getElementById('startTime').value;
        const endVal = document.getElementById('endTime').value;
        const alertSec = parseInt(document.getElementById('alertSeconds').value, 10) || 10;
        const locName = document.getElementById('locationName').value;

        if (!startVal || !endVal) { alert('Introduce horas válidas.'); return; }

        initAudio();

        const tStart = getTimeToday(startVal);
        const tEnd = getTimeToday(endVal);

        if (tEnd <= tStart) { alert('La hora de fin debe ser posterior a la de inicio.'); return; }

        document.getElementById('statusBox').style.display = 'block';
        document.getElementById('locationDisplay').textContent = locName;

        if (timerInterval) clearInterval(timerInterval);

        let startBeepPlayed = false;
        let endAlarmPlayed = false;

        timerInterval = setInterval(() => {
            const now = Date.now();
            const phaseTitle = document.getElementById('phaseTitle');
            const timerDisplay = document.getElementById('timer');
            const instruction = document.getElementById('instruction');

            if (now < tStart) {
                const diff = tStart - now;
                const secLeft = Math.ceil(diff / 1000);

                phaseTitle.textContent = "Cuenta atrás para la Totalidad:";
                timerDisplay.textContent = formatHMS(diff);

                instruction.style.display = 'block';
                instruction.className = 'alert-instruction danger';
                instruction.textContent = "🕶️ MANTÉN LAS GAFAS PUESTAS";

                if (secLeft <= alertSec && secLeft > 0 && Math.floor(diff % 1000) < 150) {
                    playLoudBeep(900, 0.15, 'square');
                }

            } else if (now >= tStart && now < tEnd) {
                const diff = tEnd - now;
                const secLeft = Math.ceil(diff / 1000);

                if (!startBeepPlayed) {
                    playLoudBeep(1500, 0.6, 'sawtooth');
                    startBeepPlayed = true;
                }

                phaseTitle.textContent = "¡ECLIPSE TOTAL EN PROCESO! Fin en:";
                timerDisplay.textContent = formatHMS(diff);

                instruction.style.display = 'block';
                instruction.className = 'alert-instruction safe';
                instruction.textContent = "😎 ¡PUEDES QUITARTE LAS GAFAS!";

                if (secLeft <= alertSec && secLeft > 0 && Math.floor(diff % 1000) < 150) {
                    playLoudBeep(1100, 0.15, 'square');
                }

            } else {
                timerDisplay.textContent = "00:00:00";
                phaseTitle.textContent = "La Totalidad ha terminado";

                instruction.style.display = 'block';
                instruction.className = 'alert-instruction danger';
                instruction.textContent = "⚠️ ¡PONTE LAS GAFAS INMEDIATAMENTE!";

                if (!endAlarmPlayed) {
                    playHeavyAlarm();
                    endAlarmPlayed = true;
                }

                clearInterval(timerInterval);
            }
        }, 150);
    }
</script>

</body>
</html>
