<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador Eclipse Total - Villanueva de la Torre</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background-color: #151d30;
            padding: 2rem;
            border-radius: 1.25rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            max-width: 520px;
            width: 100%;
            text-align: center;
            border: 1px solid #1e293b;
        }

        .location-tag {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 0.35rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        h1 { margin: 0 0 0.5rem 0; font-size: 1.6rem; color: #ffffff; letter-spacing: -0.5px; }
        p.subtitle { margin: 0 0 1.5rem 0; color: #94a3b8; font-size: 0.9rem; }

        .inputs {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 1.5rem;
            text-align: left;
            background: #0f172a;
            padding: 1.25rem;
            border-radius: 0.8rem;
            border: 1px solid #1e293b;
        }

        .input-group { display: flex; flex-direction: column; gap: 0.4rem; }
        label { font-size: 0.85rem; color: #cbd5e1; font-weight: 500; }

        input[type="time"] {
            width: 100%;
            padding: 0.65rem 0.8rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #f8fafc;
            font-size: 1.1rem;
            font-family: inherit;
        }

        input[type="time"]:focus { outline: none; border-color: #38bdf8; }

        .btn-start {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 0.6rem;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: white;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-start:hover { opacity: 0.95; transform: translateY(-1px); }

        .status-box {
            margin-top: 1.5rem;
            padding: 1.25rem;
            border-radius: 0.8rem;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            display: none;
        }

        .phase-title { font-size: 1rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.5rem; }

        .timer { 
            font-size: 2.8rem; 
            font-weight: 800; 
            font-family: ui-monospace, 'Cascadia Code', monospace; 
            color: #fbbf24;
            letter-spacing: 2px;
            margin: 0.5rem 0;
        }

        .alert-instruction {
            margin-top: 1.25rem;
            padding: 1.1rem;
            border-radius: 0.8rem;
            font-weight: 700;
            font-size: 1.15rem;
            display: none;
            text-align: center;
        }

        .safe { 
            background-color: rgba(22, 101, 52, 0.3); 
            color: #4ade80; 
            border: 2px solid #22c55e;
            animation: pulse-green 2s infinite;
        }

        .danger { 
            background-color: rgba(153, 27, 27, 0.3); 
            color: #fca5a5; 
            border: 2px solid #ef4444;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .info-footer { margin-top: 1.5rem; font-size: 0.75rem; color: #64748b; }
    </style>
</head>
<body>

<div class="card">
    <div class="location-tag">📍 Villanueva de la Torre (Guadalajara)</div>
    <h1>Eclipse Total de Sol</h1>
    <p class="subtitle">12 de agosto de 2026 — Duración totalidad: 58s</p>
    
    <div class="inputs">
        <div class="input-group">
            <label for="startTime">Inicio Totalidad:</label>
            <input type="time" id="startTime" step="1" value="20:31:36">
        </div>
        <div class="input-group">
            <label for="endTime">Final Totalidad:</label>
            <input type="time" id="endTime" step="1" value="20:32:34">
        </div>
        <button class="btn-start" onclick="startApp()">Activar Cuenta Atrás</button>
    </div>

    <div id="statusBox" class="status-box">
        <div id="phaseTitle" class="phase-title">Cargando temporizador...</div>
        <div id="timer" class="timer">00:00:00</div>
    </div>

    <div id="instruction" class="alert-instruction"></div>

    <div class="info-footer">
        Cálculos del Observatorio Astronómico Nacional (IGN)
    </div>
</div>

<script>
    let audioCtx = null;
    let timerInterval = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(freq, duration, volume = 0.15) {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {
            console.error(e);
        }
    }

    function playAlarm() {
        for (let i = 0; i < 4; i++) {
            setTimeout(() => playSound(880, 0.35, 0.5), i * 400);
        }
    }

    function getTimeToday(timeString) {
        const parts = timeString.split(':');
        const hours = parseInt(parts[0], 10);
        const minutes = parseInt(parts[1], 10);
        const seconds = parts[2] ? parseInt(parts[2], 10) : 0;
        
        const date = new Date();
        date.setHours(hours, minutes, seconds, 0);
        return date.getTime();
    }

    function formatHMS(ms) {
        const totalSec = Math.max(0, Math.floor(ms / 1000));
        const h = Math.floor(totalSec / 3600).toString().padStart(2, '0');
        const m = Math.floor((totalSec % 3600) / 60).toString().padStart(2, '0');
        const s = (totalSec % 60).toString().padStart(2, '0');
        return `${h}:${m}:${s}`;
    }

    function startApp() {
        const startVal = document.getElementById('startTime').value;
        const endVal = document.getElementById('endTime').value;

        if (!startVal || !endVal) {
            alert('Por favor, introduce las horas de inicio y fin.');
            return;
        }

        initAudio();

        const tStart = getTimeToday(startVal);
        const tEnd = getTimeToday(endVal);

        if (tEnd <= tStart) {
            alert('La hora de fin debe ser posterior a la de inicio.');
            return;
        }

        document.getElementById('statusBox').style.display = 'block';
        if (timerInterval) clearInterval(timerInterval);

        let startBeepPlayed = false;
        let endAlarmPlayed = false;

        timerInterval = setInterval(() => {
            const now = Date.now();
            const phaseTitle = document.getElementById('phaseTitle');
            const timerDisplay = document.getElementById('timer');
            const instruction = document.getElementById('instruction');

            if (now < tStart) {
                const diff = tStart - now;
                const secLeft = Math.ceil(diff / 1000);

                phaseTitle.textContent = "Cuenta atrás para la Totalidad:";
                timerDisplay.textContent = formatHMS(diff);
                
                instruction.style.display = 'block';
                instruction.className = 'alert-instruction danger';
                instruction.textContent = "🕶️ MANTÉN LAS GAFAS PUESTAS";

                if (secLeft <= 5 && secLeft > 0 && Math.floor(diff % 1000) < 150) {
                    playSound(440, 0.15, 0.2);
                }

            } else if (now >= tStart && now < tEnd) {
                const diff = tEnd - now;
                const secLeft = Math.ceil(diff / 1000);

                if (!startBeepPlayed) {
                    playSound(523.25, 0.6, 0.4);
                    startBeepPlayed = true;
                }

                phaseTitle.textContent = "¡ECLIPSE TOTAL EN PROCESO! Fin en:";
                timerDisplay.textContent = formatHMS(diff);

                instruction.style.display = 'block';
                instruction.className = 'alert-instruction safe';
                instruction.textContent = "😎 ¡PUEDES QUITARTE LAS GAFAS!";

                if (secLeft <= 5 && secLeft > 0 && Math.floor(diff % 1000) < 150) {
                    playSound(660, 0.15, 0.25);
                }

            } else {
                timerDisplay.textContent = "00:00:00";
                phaseTitle.textContent = "La Totalidad ha terminado";

                instruction.style.display = 'block';
                instruction.className = 'alert-instruction danger';
                instruction.textContent = "⚠️ ¡PONTE LAS GAFAS INMEDIATAMENTE!";

                if (!endAlarmPlayed) {
                    playAlarm();
                    endAlarmPlayed = true;
                }

                clearInterval(timerInterval);
            }
        }, 150);
    }
</script>

</body>
</html>
